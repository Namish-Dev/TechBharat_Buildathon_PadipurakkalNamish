<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Inline Summarizer — Settings</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 520px;
      margin: 40px auto;
      color: #222;
      padding: 0 16px;
    }

    h2 {
      margin-bottom: 4px;
    }

    .hint {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-top: 18px;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    button {
      margin-top: 20px;
      padding: 10px 16px;
      font-size: 14px;
      background: #6c5ce7;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #5a4bd1;
    }

    #status {
      margin-top: 12px;
      color: #16803c;
      font-size: 13px;
      display: none;
    }

    .provider-note {
      margin-top: 8px;
      color: #666;
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>

<body>
  <h2>Inline Summarizer Settings</h2>

  <p class="hint">
    Choose your AI provider, paste your API key, and select or type a model name.
    Keys are stored locally in this Chrome profile using <code>chrome.storage.local</code>.
  </p>

  <label for="provider">AI provider</label>
  <select id="provider">
    <option value="openrouter">OpenRouter</option>
    <option value="gemini">Google Gemini</option>
  </select>

  <label for="api-key">API key</label>
  <input
    id="api-key"
    type="password"
    placeholder="Paste your API key"
    autocomplete="off"
  />

  <div class="provider-note" id="provider-note"></div>

  <label for="model">Model</label>
  <input
    id="model"
    type="text"
    list="model-options"
    placeholder="Choose or type a model name"
    autocomplete="off"
  />

  <datalist id="model-options">
    <!-- Updated dynamically from options.js -->
  </datalist>

  <button id="save-btn">Save settings</button>
  <div id="status">Saved successfully.</div>

  <script src="options.js"></script>
</body>
</html>
